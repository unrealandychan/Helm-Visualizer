name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint .

      - name: Run tests (Vitest)
        run: npx vitest run

  helm-plugin-windows:
    name: Helm Plugin (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # helm-plugin has no package.json — skip npm ci
      - name: Validate run.bat exists and is non-empty
        shell: cmd
        run: |
          if not exist helm-plugin\scripts\run.bat (
            echo ERROR: helm-plugin\scripts\run.bat not found
            exit /b 1
          )
          for %%A in (helm-plugin\scripts\run.bat) do (
            if %%~zA==0 (
              echo ERROR: helm-plugin\scripts\run.bat is empty
              exit /b 1
            )
          )
          echo run.bat validated

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
